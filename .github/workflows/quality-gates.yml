name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1
  VITEST_SHARD_TOTAL: 2

jobs:
  rust-clippy:
    name: Rust (fmt + clippy)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ai-digital-life
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      # 与 rust-test 共享同一缓存；本 job 只 restore 不 save，
      # 避免两个并行 job 同时 save 竞争（save 只留在 rust-test）。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ai-digital-life
          shared-key: quality-gates
          save-if: false

      # tauri::generate_context!() requires build.frontendDist (../frontend/dist) to exist.
      # clippy/test compile the src-tauri shell but never run the frontend build, so stub it.
      - name: Create frontend dist placeholder
        run: |
          New-Item -ItemType Directory -Force -Path frontend/dist | Out-Null
          Set-Content -Path frontend/dist/index.html -Value '<!doctype html><title>ci</title>'

      # tauri.conf.json declares bundle.externalBin (adl-server sidecar);
      # tauri-build copies it in its build script and fails the build when
      # the staged file is missing — so stage a dev-built sidecar first.
      - name: Stage adl-server sidecar
        run: |
          cargo build -p adl-server
          powershell -NoProfile -File scripts/copy-adl-server-sidecar.ps1 -Profile debug

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    name: Rust (test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ai-digital-life
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      # 缓存 save 只留在这里（见 rust-clippy 的注释）。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ai-digital-life
          shared-key: quality-gates

      - name: Create frontend dist placeholder
        run: |
          New-Item -ItemType Directory -Force -Path frontend/dist | Out-Null
          Set-Content -Path frontend/dist/index.html -Value '<!doctype html><title>ci</title>'

      # Same externalBin prerequisite as rust-clippy (see comment there).
      - name: Stage adl-server sidecar
        run: |
          cargo build -p adl-server
          powershell -NoProfile -File scripts/copy-adl-server-sidecar.ps1 -Profile debug

      - name: cargo test
        run: cargo test --workspace

      - name: Disk cleanup (over 30GB → full clean)
        run: powershell -NoProfile -File .cargo\clean-target.ps1

  frontend-static:
    name: Frontend (lint + format + typecheck)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ai-digital-life/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ai-digital-life/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: TypeScript (dev server tooling)
        run: pnpm typecheck:dev

      - name: Prettier format check
        run: pnpm format:check

      - name: i18n coverage check
        run: pnpm check:i18n

  frontend-test:
    name: Frontend (vitest shard ${{ matrix.shard }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: ai-digital-life/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ai-digital-life/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 分片数改顶层 VITEST_SHARD_TOTAL（需与 matrix.shard 取值同步）。
      - name: Vitest (shard ${{ matrix.shard }}/${{ env.VITEST_SHARD_TOTAL }})
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/${{ env.VITEST_SHARD_TOTAL }}
