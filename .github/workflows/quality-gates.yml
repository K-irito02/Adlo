name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ai-digital-life
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ai-digital-life

      # tauri::generate_context!() requires build.frontendDist (../frontend/dist) to exist.
      # clippy/test compile the src-tauri shell but never run the frontend build, so stub it.
      - name: Create frontend dist placeholder
        run: |
          New-Item -ItemType Directory -Force -Path frontend/dist | Out-Null
          Set-Content -Path frontend/dist/index.html -Value '<!doctype html><title>ci</title>'

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: Disk cleanup (over 30GB → full clean)
        run: powershell -NoProfile -File .cargo\clean-target.ps1

  frontend:
    name: Frontend (lint + format + typecheck + test)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ai-digital-life/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ai-digital-life/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: TypeScript (dev server tooling)
        run: pnpm typecheck:dev

      - name: Prettier format check
        run: pnpm format:check

      - name: i18n coverage check
        run: pnpm check:i18n

      - name: Vitest
        run: pnpm test
