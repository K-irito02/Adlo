[workspace]
resolver = "2"
members = [
    "crates/kernel",
    "crates/errors",
    "crates/migration",
    "crates/storage",
    "crates/workspace",
    "crates/outline",
    "crates/context",
    "crates/command",
    "crates/pty",
    "crates/fs-ops",
    "crates/task",
    "crates/conversation",
    "crates/agent-runtime",
    "crates/model-gateway",
    "crates/change-engine",
    "crates/browser",
    "crates/ci-status",
    "crates/credential",
    "crates/adl-logging",
    "crates/subagent",
    "crates/mcp-client",
    "crates/lsp-client",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-appender = "0.2"
rusqlite = { version = "0.39", features = ["bundled"] }
notify = "7"
reqwest = { version = "0.13.2", features = ["json", "rustls", "query", "form", "stream"], default-features = false }
keyring = { version = "3", features = ["crypto-rust"] }
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
portable-pty = "0.8"
dirs = "5"
trash = "5"
url = "2"
async-trait = "0.1"
tokio-stream = "0.1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
rmcp = { version = "1", features = ["client", "server", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
rmcp-macros = "2"
lsp-server = "0.7"
lsp-types = "0.97"

[profile.dev]
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
