[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/kernel",
    "crates/errors",
    "crates/migration",
    "crates/storage",
    "crates/workspace",
    "crates/outline",
    "crates/pty",
    "crates/fs-ops",
    "crates/change-engine",
    "crates/browser",
    "crates/ci-status",
    "crates/credential",
    "crates/dsh-version",
    "crates/adl-logging",
    "crates/clipboard",
    "crates/sysmon",
    "crates/server",
    "crates/webapp-host",
    "crates/download-source",
    "crates/dsh-bundle",
    "crates/adl-hosted",
    "crates/adl-env",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.lints.rust]

[workspace.lints.clippy]
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "sync", "time", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-appender = "0.2"
rusqlite = { version = "0.39", features = ["bundled", "serde_json"] }
notify = "7"
reqwest = { version = "0.13.2", features = ["json", "rustls", "query", "form", "stream", "system-proxy", "blocking"], default-features = false }
tauri = "2"
tauri-build = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
regex = "1"
rust-pty = "0.6"
dirs = "5"
trash = "5"
url = "2"
async-trait = "0.1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
indexmap = "2"
base64 = "0.22"

[profile.dev]
opt-level = 0

# Override: optimize regex & glob crates in debug to speed up generate_context!() ACL resolution
# which compiles ~300-500 glob::Pattern instances at startup (each triggers regex compilation)
[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.glob]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"

[patch.crates-io]
tauri-runtime-wry = { path = "crates/tauri-runtime-wry-patched" }
