<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        --strip-line: #c8c8c8;
        --strip-glow: #888888;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #adl-divider-strip {
        position: relative;
        width: 100%;
        height: 100%;
        background: transparent;
        cursor: col-resize;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        outline: none;
      }
      #adl-divider-strip::before {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 1px;
        margin-left: -0.5px;
        background: var(--strip-line);
        opacity: 0.9;
      }
      #adl-divider-strip:hover::before,
      #adl-divider-strip.is-dragging::before {
        width: 3px;
        margin-left: -1.5px;
        background: var(--strip-glow);
        opacity: 1;
      }
    </style>
    <script type="module" src="/src/divider-strip/strip.ts"></script>
  </head>
  <body>
    <div id="adl-divider-strip" role="separator" aria-orientation="vertical"></div>
  </body>
</html>
