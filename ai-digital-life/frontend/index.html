<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="AI Digital Life desktop foundation - Phase 0" />
    <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1224" media="(prefers-color-scheme: dark)" />
    <title>AI Digital Life</title>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      #adl-loading {
        position: fixed; inset: 0; z-index: 999999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background: var(--adl-loading-bg, #f8fafc);
        transition: opacity 0.4s ease;
      }
      #adl-loading.is-hidden { opacity: 0; pointer-events: none; }
      @media (prefers-color-scheme: dark) {
        #adl-loading { --adl-loading-bg: #0f172a; }
      }
      .adl-loading-ring {
        width: 48px; height: 48px;
        border: 3px solid #e2e8f0;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: adl-spin 0.8s linear infinite;
      }
      @keyframes adl-spin { to { transform: rotate(360deg); } }
      .adl-loading-text {
        margin-top: 20px;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #64748b;
        letter-spacing: 0.5px;
      }
      .adl-loading-dots::after {
        content: '';
        animation: adl-dots 1.5s steps(4, end) infinite;
      }
      @keyframes adl-dots {
        0%   { content: ''; }
        25%  { content: '.'; }
        50%  { content: '..'; }
        75%  { content: '...'; }
      }
    </style>
  </head>
  <body>
    <div id="adl-loading">
      <div class="adl-loading-ring"></div>
      <div class="adl-loading-text">AI Digital Life<span class="adl-loading-dots"></span></div>
    </div>
    <div id="app" role="application"></div>
  </body>
</html>
