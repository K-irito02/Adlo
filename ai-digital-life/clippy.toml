cognitive-complexity-threshold = 25
too-many-arguments-threshold = 8
too-many-lines-threshold = 800
large-error-threshold = 128
type-complexity-threshold = 250
disallowed-names = ["foo", "bar", "baz", "qux"]
doc-valid-idents = [
    "iOS", "macOS", "Linux", "Windows",
    "SQLite", "SQL",
    "WebView", "Tauri",
    "IPC", "CLI", "MVP", "PTY",
    "CSS", "HTML", "DOM",
    "API", "JSON", "XML", "YAML", "Regex", "URI", "UUID",
    "OpenCode", "DigitalLife", "ADL",
    "Zustand", "CodeMirror", "Xterm",
    "Serde", "Tokio", "Rusqlite", "Anyhow", "Thiserror",
    "TauriCommand", "IpcResult", "IpcErrorCode", "AppError",
    "Prettier", "ESLint", "Clippy", "Rustfmt",
    "EditorConfig",
    "PhantomData",
    "GitHub", "Git", "CI",
]
disallowed-methods = [
    # "std::process::exit" — disabled: Tauri's generate_context!() macro internally references it,
    # causing false positives in src-tauri/src/main.rs
]
disallowed-macros = [
    # "unreachable" — disabled: not a valid macro path in stable clippy
]
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
msrv = "1.85"
