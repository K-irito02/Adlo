[package]
name = "ai-digital-life"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
adl-kernel = { path = "../crates/kernel" }
adl-types = { path = "../crates/types" }
adl-errors = { path = "../crates/errors" }
adl-workspace = { path = "../crates/workspace" }
adl-model-gateway = { path = "../crates/model-gateway" }
adl-browser = { path = "../crates/browser" }
adl-logging = { path = "../crates/adl-logging" }

tauri = { workspace = true, features = ["unstable"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-shell.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
reqwest.workspace = true
url.workspace = true
base64 = "0.22"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
