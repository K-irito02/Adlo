[package]
name = "ai-digital-life"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
adl-kernel = { path = "../crates/kernel" }
adl-types = { path = "../crates/types" }
adl-errors = { path = "../crates/errors" }
adl-storage = { path = "../crates/storage" }
adl-migration = { path = "../crates/migration" }
adl-workspace = { path = "../crates/workspace" }
adl-fs-ops = { path = "../crates/fs-ops" }
adl-task = { path = "../crates/task" }
adl-conversation = { path = "../crates/conversation" }
adl-agent-runtime = { path = "../crates/agent-runtime" }
adl-model-gateway = { path = "../crates/model-gateway" }
adl-change-engine = { path = "../crates/change-engine" }
adl-context = { path = "../crates/context" }
adl-pty = { path = "../crates/pty" }
adl-command = { path = "../crates/command" }
adl-browser = { path = "../crates/browser" }
adl-ci-status = { path = "../crates/ci-status" }
adl-credential = { path = "../crates/credential" }
adl-logging = { path = "../crates/adl-logging" }
adl-subagent = { path = "../crates/subagent" }
adl-mcp-client = { path = "../crates/mcp-client" }
adl-lsp-client = { path = "../crates/lsp-client" }

tauri = { workspace = true, features = ["unstable"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-shell.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
reqwest.workspace = true
url.workspace = true
uuid.workspace = true
dirs.workspace = true
async-trait.workspace = true
tokio-stream.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
