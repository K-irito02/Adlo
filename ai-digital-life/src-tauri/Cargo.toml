[package]
name = "ai-digital-life"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
adl-kernel = { path = "../crates/kernel" }
adl-types = { path = "../crates/types" }
adl-errors = { path = "../crates/errors" }
adl-workspace = { path = "../crates/workspace" }
adl-browser = { path = "../crates/browser" }
adl-logging = { path = "../crates/adl-logging" }
adl-storage = { path = "../crates/storage" }
adl-migration = { path = "../crates/migration" }
adl-clipboard = { path = "../crates/clipboard" }
adl-sysmon = { path = "../crates/sysmon" }

tauri = { workspace = true, features = ["unstable"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-shell.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
futures.workspace = true
reqwest.workspace = true
url.workspace = true
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
