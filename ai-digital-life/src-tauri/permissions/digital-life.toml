[[permission]]
identifier = "digital-life-commands"
description = "Allow AI Digital Life system-shell Tauri commands (app/browser/platform/provider/reserved/workspace-picker). Business commands are served by the ad-server over HTTP."
commands.allow = [
  "app_get_info",
  "app_get_health",
  "app_get_diagnostics",
  "app_get_model_health",
  "app_update_preferences",
  "app_get_server_info",
  "write_debug_logs",
  "write_debug_logs_to_project",
  "app_set_log_mode",
  "workspace_pick_directory",
  "workspace_reveal_in_file_manager",
  "get_provider_api_key",
  "has_provider_api_key",
  "browser_create_for_tab",
  "browser_activate_tab",
  "browser_destroy_tab",
  "browser_navigate_tab",
  "browser_set_tab_bounds",
  "browser_go_back_tab",
  "browser_go_forward_tab",
  "browser_can_go_back_tab",
  "browser_can_go_forward_tab",
  "browser_reload_tab",
  "browser_fetch_page_meta",
  "browser_mute_tab",
  "browser_set_color_scheme",
  "browser_set_zoom",
  "browser_clear_cookies",
  "browser_clear_cache",
  "browser_site_meta_get_all",
  "browser_page_meta_get",
  "browser_page_meta_report",
  "browser_page_meta_refresh",
  "browser_page_meta_warmup",
  "acp_get_status",
  "acp_get_config",
  "http_api_get_status",
  "http_api_get_config",
  "codemode_execute",
  "codemode_get_config"
]
