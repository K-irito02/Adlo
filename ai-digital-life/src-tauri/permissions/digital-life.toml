  "task_get_snapshot",
  "task_list_pending_approvals",
  "task_list_audit_entries",
  "task_decide_approval",
  "task_get_checkpoint_preview",
  "task_restore_checkpoint",
  "model_set_provider_secret",
  "model_clear_provider_secret"
