[package]
name = "adl-credential"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
adl-errors = { path = "../errors" }
aes-gcm = "0.10"
dirs.workspace = true
hex = "0.4"
hkdf = "0.12"
sha2.workspace = true
tracing.workspace = true
uuid.workspace = true

# keyring v3.x has NO default features: without an explicit platform backend it
# silently falls back to the in-memory mock store (CredentialPersistence::EntryOnly),
# so saved credentials never survive an app restart. Each OS must opt into its
# real store explicitly. The encrypted-file fallback in lib.rs engages when
# keyring::Entry::new fails OR when an availability probe (get_password) shows
# the native store is unusable (headless Linux / locked keychain), so credentials
# still persist in environments without a working system keyring.
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["crypto-rust", "windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["crypto-rust", "apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["crypto-rust", "sync-secret-service"] }
