# Cargo 工作区配置
#
# 重要：target/debug/incremental/ 目录会无限增长（每次编译创建新会话，Cargo 不自动清理）。
# 运行以下命令清理旧增量缓存（保留 7 天内会话用于快速增量编译）：
#
#   powershell -File .cargo/clean-incremental.ps1
#
# 或完全重建：
#   cargo clean && cargo build

[alias]
# 清理所有构建产物（释放 ~40 GB），然后完整重建
rebuild = "clean && build"

[profile.dev]
# 禁用增量编译绕过 rustc 1.96.0 ICE bug：
#   thread 'rustc' panicked at .../rustc_metadata/src/rmeta/encoder.rs:2448:51:
#   no entry found for key
# adl-subagent crate 在增量编译时触发此内部编译器错误，与代码逻辑无关。
# 详见 https://github.com/rust-lang/rust/issues?q=is%3Aissue+rmeta+encoder+no+entry+found
incremental = false
