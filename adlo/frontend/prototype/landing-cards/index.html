<!doctype html>
<html lang="zh-CN" data-theme="dark" data-variant="A" data-bg="photo">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>原型 · 新建标签页卡片透明化</title>
    <style>
      /* ────────────────────────────────────────────────────────────────
         一次性原型（PROTOTYPE）：只回答「快捷站点 / 本地端口卡片在自定义
         背景上应该长什么样」。数值近似真实主题 token，不追求与实现一比一。
         看完即弃，最终只把选中的一套写回 ShortcutGrid.css / LocalPortSection.css。
         ──────────────────────────────────────────────────────────────── */
      :root {
        --font: 'Segoe UI', 'Microsoft YaHei UI', system-ui, sans-serif;
        --radius: 10px;
        --radius-sm: 6px;
        --accent: #2563eb;
        --color-success: #3ecf8e;
        --danger: #ef4444;
      }
      [data-theme='dark'] {
        --text-primary: #ededed;
        --text-secondary: #b4b4b4;
        --text-muted: #8a8a8a;
        --bg-hover: rgba(255, 255, 255, 0.08);
        --bg-active: rgba(255, 255, 255, 0.14);
        --border-subtle: rgba(255, 255, 255, 0.12);
        --border-strong: rgba(255, 255, 255, 0.28);
        --focus-border: #ffffff;
      }
      [data-theme='light'] {
        --text-primary: #1b1b1b;
        --text-secondary: #4d4d4d;
        --text-muted: #737373;
        --bg-hover: rgba(0, 0, 0, 0.06);
        --bg-active: rgba(0, 0, 0, 0.1);
        --border-subtle: rgba(0, 0, 0, 0.12);
        --border-strong: rgba(0, 0, 0, 0.28);
        --focus-border: #000000;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: var(--font);
        color: var(--text-primary);
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* 背景：用 CSS 层叠代替真实照片（原型不依赖外部素材）。 */
      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        padding: 48px 40px 90px;
      }
      .stage::before,
      .stage::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .stage::before {
        z-index: 0;
        transition: filter 240ms ease;
      }
      /* 照片感：柔和彩色光斑，细节中等 */
      [data-bg='photo'] .stage::before {
        background:
          radial-gradient(circle at 18% 22%, #f5a623 0%, transparent 42%),
          radial-gradient(circle at 78% 18%, #7c5cff 0%, transparent 46%),
          radial-gradient(circle at 62% 82%, #14b8a6 0%, transparent 48%),
          radial-gradient(circle at 22% 84%, #ef476f 0%, transparent 40%),
          linear-gradient(135deg, #14181f, #232a33 55%, #0e1116);
      }
      /* 高对比：明暗交界 + 细碎纹理，专门考验文字可读性 */
      [data-bg='busy'] .stage::before {
        background:
          repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.14) 0 2px, transparent 2px 9px),
          radial-gradient(circle at 30% 30%, #ffffff 0%, #ffbf47 18%, transparent 46%),
          radial-gradient(circle at 74% 70%, #0b1a3a 0%, #1d4ed8 30%, transparent 58%),
          linear-gradient(90deg, #ffffff 0 28%, #0a0a0a 28% 72%, #2b2b2b 72%);
      }
      /* 平滑：接近默认渐变，验证不用自定义背景时也不难看 */
      [data-bg='gradient'] .stage::before {
        background: linear-gradient(135deg, #0a0a0a 0%, #2a2a2a 50%, #121212 100%);
      }
      [data-theme='light'][data-bg='gradient'] .stage::before {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      }
      .stage::after {
        z-index: 1;
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.32));
        opacity: 0.5;
      }
      [data-theme='light'] .stage::after {
        background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.12));
      }

      .landing {
        position: relative;
        z-index: 2;
        width: min(760px, 100%);
      }
      .section-title {
        margin: 0 0 12px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.45);
      }
      [data-theme='light'] .section-title {
        text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
      }
      .section + .section {
        margin-top: 22px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      /* ── 通用卡片底盘：四套变体只覆盖外观 ───────────────────────── */
      .shortcut {
        width: 56px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        cursor: pointer;
        user-select: none;
      }
      .shortcut-box {
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius);
        transition:
          background 140ms ease,
          border-color 140ms ease,
          box-shadow 140ms ease,
          transform 140ms ease;
      }
      .shortcut-icon {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #5b8def, #2b4c9b);
      }
      .shortcut-icon--orange {
        background: linear-gradient(135deg, #ffb454, #e07a1f);
      }
      .shortcut-icon--green {
        background: linear-gradient(135deg, #57d9a3, #1f8f6a);
      }
      .shortcut-icon--pink {
        background: linear-gradient(135deg, #ff7eb3, #c2366b);
      }
      .shortcut-icon--violet {
        background: linear-gradient(135deg, #a78bfa, #6d43d8);
      }
      .shortcut-name {
        width: 100%;
        font-size: 10px;
        line-height: 1.3;
        text-align: center;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .port {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: var(--radius);
        cursor: pointer;
        font-size: 13px;
        transition:
          background 140ms ease,
          border-color 140ms ease,
          box-shadow 140ms ease;
      }
      .port-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--color-success);
        box-shadow: 0 0 0 2px rgba(62, 207, 142, 0.22);
        flex-shrink: 0;
      }
      .port-dot--off {
        background: var(--danger);
        box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.22);
      }
      .port-address {
        font-weight: 500;
        color: var(--text-primary);
        font-variant-numeric: tabular-nums;
      }
      .port-label {
        font-size: 11px;
        color: var(--text-muted);
      }
      .port-add {
        border: 1px dashed var(--border-strong);
        color: var(--text-muted);
        font-size: 12px;
        opacity: 0.55;
      }
      .port-add:hover {
        opacity: 0.9;
      }

      /* ── A 玻璃模糊 ─────────────────────────────────────────────── */
      [data-variant='A'] .shortcut-box,
      [data-variant='A'] .port {
        background: rgba(22, 24, 28, 0.34);
        border: 1px solid rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(14px) saturate(1.15);
        -webkit-backdrop-filter: blur(14px) saturate(1.15);
      }
      [data-theme='light'][data-variant='A'] .shortcut-box,
      [data-theme='light'][data-variant='A'] .port {
        background: rgba(255, 255, 255, 0.42);
        border-color: rgba(0, 0, 0, 0.1);
      }
      [data-variant='A'] .shortcut-box:hover,
      [data-variant='A'] .port:hover {
        background: rgba(255, 255, 255, 0.2);
        border-color: rgba(255, 255, 255, 0.3);
        transform: translateY(-1px);
      }
      [data-theme='light'][data-variant='A'] .shortcut-box:hover,
      [data-theme='light'][data-variant='A'] .port:hover {
        background: rgba(255, 255, 255, 0.62);
        border-color: rgba(0, 0, 0, 0.16);
      }
      [data-variant='A'] .shortcut-name {
        color: #e8e8e8;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
      }
      [data-theme='light'][data-variant='A'] .shortcut-name {
        color: #2b2b2b;
        text-shadow: 0 1px 2px rgba(255, 255, 255, 0.6);
      }

      /* ── B 纯透明描边 ───────────────────────────────────────────── */
      [data-variant='B'] .shortcut-box,
      [data-variant='B'] .port {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.32);
      }
      [data-theme='light'][data-variant='B'] .shortcut-box,
      [data-theme='light'][data-variant='B'] .port {
        border-color: rgba(0, 0, 0, 0.24);
      }
      [data-variant='B'] .shortcut-box:hover,
      [data-variant='B'] .port:hover {
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.55);
      }
      [data-theme='light'][data-variant='B'] .shortcut-box:hover,
      [data-theme='light'][data-variant='B'] .port:hover {
        background: rgba(0, 0, 0, 0.07);
        border-color: rgba(0, 0, 0, 0.4);
      }
      [data-variant='B'] .shortcut-name,
      [data-variant='B'] .port-address {
        color: #f2f2f2;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      [data-theme='light'][data-variant='B'] .shortcut-name,
      [data-theme='light'][data-variant='B'] .port-address {
        color: #161616;
        text-shadow: 0 1px 2px rgba(255, 255, 255, 0.65);
      }

      /* ── C 图标悬浮（无容器） ───────────────────────────────────── */
      [data-variant='C'] .shortcut-box,
      [data-variant='C'] .port {
        background: transparent;
        border: 1px solid transparent;
      }
      [data-variant='C'] .shortcut-box:hover,
      [data-variant='C'] .port:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.16);
      }
      [data-variant='C'] .shortcut-icon {
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, 0.22),
          0 6px 16px rgba(0, 0, 0, 0.4);
      }
      [data-theme='light'][data-variant='C'] .shortcut-icon {
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, 0.8),
          0 6px 16px rgba(0, 0, 0, 0.18);
      }
      [data-variant='C'] .shortcut-box:hover .shortcut-icon {
        transform: scale(1.06);
      }
      [data-variant='C'] .shortcut-name,
      [data-variant='C'] .port-address {
        color: #fff;
        text-shadow:
          0 1px 2px rgba(0, 0, 0, 0.85),
          0 0 10px rgba(0, 0, 0, 0.45);
      }
      [data-theme='light'][data-variant='C'] .shortcut-name,
      [data-theme='light'][data-variant='C'] .port-address {
        color: #101010;
        text-shadow:
          0 1px 2px rgba(255, 255, 255, 0.9),
          0 0 10px rgba(255, 255, 255, 0.7);
      }
      [data-variant='C'] .port {
        padding-left: 4px;
      }

      /* ── D 底部 scrim ───────────────────────────────────────────── */
      [data-variant='D'] .shortcut-box,
      [data-variant='D'] .port {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.14);
      }
      [data-variant='D'] .shortcut-box {
        position: relative;
        overflow: hidden;
      }
      [data-variant='D'] .shortcut-box::after {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 16px;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.5), transparent);
        pointer-events: none;
      }
      [data-theme='light'][data-variant='D'] .shortcut-box {
        border-color: rgba(0, 0, 0, 0.12);
      }
      [data-theme='light'][data-variant='D'] .shortcut-box::after {
        background: linear-gradient(to top, rgba(255, 255, 255, 0.6), transparent);
      }
      [data-variant='D'] .port {
        background: linear-gradient(to top, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.08));
        border-color: rgba(255, 255, 255, 0.14);
      }
      [data-theme='light'][data-variant='D'] .port {
        background: linear-gradient(to top, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.24));
        border-color: rgba(0, 0, 0, 0.1);
      }
      [data-variant='D'] .shortcut-box:hover,
      [data-variant='D'] .port:hover {
        border-color: rgba(255, 255, 255, 0.32);
      }
      [data-variant='D'] .shortcut-name,
      [data-variant='D'] .port-address {
        color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
      }
      [data-theme='light'][data-variant='D'] .shortcut-name,
      [data-theme='light'][data-variant='D'] .port-address {
        color: #101010;
        text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
      }

      /* 底部文字按钮：与真实落地页一致 */
      .footer {
        position: absolute;
        z-index: 2;
        left: 0;
        right: 0;
        bottom: 28px;
        display: flex;
        justify-content: center;
        gap: 20px;
      }
      .footer button {
        border: none;
        background: none;
        padding: 4px 8px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        color: var(--text-muted);
        cursor: pointer;
      }
      .footer button:hover {
        color: var(--text-primary);
        background: var(--bg-hover);
      }

      /* 原型控制条 */
      .bar {
        position: fixed;
        z-index: 20;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 14px;
        background: rgba(18, 18, 18, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(18px);
        color: #ededed;
        font-size: 12px;
      }
      .bar__label {
        color: #a3a3a3;
        padding: 0 4px;
      }
      .bar button {
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.06);
        color: #dcdcdc;
        padding: 5px 10px;
        border-radius: 8px;
        font-size: 12px;
        cursor: pointer;
      }
      .bar button:hover {
        background: rgba(255, 255, 255, 0.14);
      }
      .bar button.is-active {
        background: #ededed;
        color: #111;
        border-color: #ededed;
      }
      .bar__sep {
        width: 1px;
        height: 18px;
        background: rgba(255, 255, 255, 0.16);
      }

      .note {
        position: absolute;
        z-index: 2;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        max-width: min(720px, calc(100% - 80px));
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.12);
        backdrop-filter: blur(10px);
        font-size: 12px;
        line-height: 1.5;
        color: #e6e6e6;
      }
      [data-theme='light'] .note {
        background: rgba(255, 255, 255, 0.72);
        border-color: rgba(0, 0, 0, 0.1);
        color: #222;
      }
      .note b {
        color: #fff;
      }
      [data-theme='light'] .note b {
        color: #000;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="note" id="note"></div>

      <main class="landing">
        <section class="section">
          <h2 class="section-title">快捷站点</h2>
          <div class="row">
            <div class="shortcut">
              <div class="shortcut-box"><span class="shortcut-icon">D</span></div>
              <span class="shortcut-name">DeepSeek</span>
            </div>
            <div class="shortcut">
              <div class="shortcut-box">
                <span class="shortcut-icon shortcut-icon--orange">G</span>
              </div>
              <span class="shortcut-name">GitHub</span>
            </div>
            <div class="shortcut">
              <div class="shortcut-box">
                <span class="shortcut-icon shortcut-icon--green">N</span>
              </div>
              <span class="shortcut-name">Notion 工作台</span>
            </div>
            <div class="shortcut">
              <div class="shortcut-box">
                <span class="shortcut-icon shortcut-icon--pink">B</span>
              </div>
              <span class="shortcut-name">Bilibili</span>
            </div>
            <div class="shortcut">
              <div class="shortcut-box">
                <span class="shortcut-icon shortcut-icon--violet">F</span>
              </div>
              <span class="shortcut-name">Figma</span>
            </div>
            <div class="shortcut">
              <div class="shortcut-box" style="border-style: dashed; opacity: 0.5">
                <span style="font-size: 20px; color: var(--text-muted)">+</span>
              </div>
              <span class="shortcut-name">添加快捷站点</span>
            </div>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">本地端口</h2>
          <div class="row">
            <div class="port">
              <span class="port-dot"></span>
              <span class="port-address">localhost:3080</span>
              <span class="port-label">DSH</span>
            </div>
            <div class="port">
              <span class="port-dot"></span>
              <span class="port-address">localhost:5173</span>
              <span class="port-label">dev</span>
            </div>
            <div class="port">
              <span class="port-dot port-dot--off"></span>
              <span class="port-address">localhost:3000</span>
              <span class="port-label">api</span>
            </div>
            <div class="port port-add">
              <span style="font-size: 16px">+</span>
              <span>添加端口</span>
            </div>
          </div>
        </section>
      </main>

      <div class="footer">
        <button type="button">端口扫描配置</button>
        <button type="button">自定义背景</button>
      </div>
    </div>

    <div class="bar" role="group" aria-label="原型控制">
      <span class="bar__label">方案</span>
      <button type="button" data-set-variant="A">A 玻璃模糊</button>
      <button type="button" data-set-variant="B">B 纯透明描边</button>
      <button type="button" data-set-variant="C">C 图标悬浮</button>
      <button type="button" data-set-variant="D">D 底部 scrim</button>
      <span class="bar__sep"></span>
      <span class="bar__label">背景</span>
      <button type="button" data-set-bg="photo">照片感</button>
      <button type="button" data-set-bg="busy">高对比</button>
      <button type="button" data-set-bg="gradient">默认渐变</button>
      <span class="bar__sep"></span>
      <button type="button" id="theme-toggle">切换亮/暗</button>
    </div>

    <script>
      const NOTES = {
        A: '<b>A 玻璃模糊</b>：半透明底 + 背景模糊 + 细描边。背景再花也能压住，最有成品感；代价是模糊层有 GPU 成本（静态卡片可忽略）。',
        B: '<b>B 纯透明描边</b>：无底色，只有 1px 描边，悬停才浮出淡底。与自定义背景融合最好；高对比背景上文字需要投影兜底。',
        C: '<b>C 图标悬浮</b>：完全去掉卡片容器，图标 + 名称直接浮在背景上。最轻盈；密集背景上必须靠图标描边与文字投影保证辨识度。',
        D: '<b>D 底部 scrim</b>：图标区透明，名称/地址区用半透明渐变压暗。透感与可读性折中；结构比前几套多一层伪元素。',
      };
      const params = new URLSearchParams(location.search);
      const root = document.documentElement;

      function apply(key, value) {
        root.dataset[key] = value;
        const url = new URL(location.href);
        url.searchParams.set(key === 'variant' ? 'variant' : key === 'bg' ? 'bg' : 'theme', value);
        history.replaceState(null, '', url);
      }

      function syncUi() {
        document.querySelectorAll('[data-set-variant]').forEach((button) => {
          button.classList.toggle('is-active', button.dataset.setVariant === root.dataset.variant);
        });
        document.querySelectorAll('[data-set-bg]').forEach((button) => {
          button.classList.toggle('is-active', button.dataset.setBg === root.dataset.bg);
        });
        document.getElementById('note').innerHTML = NOTES[root.dataset.variant] || '';
      }

      const initialVariant = (params.get('variant') || 'A').toUpperCase();
      root.dataset.variant = ['A', 'B', 'C', 'D'].includes(initialVariant) ? initialVariant : 'A';
      root.dataset.bg = params.get('bg') || 'photo';
      root.dataset.theme = params.get('theme') === 'light' ? 'light' : 'dark';
      syncUi();

      document.querySelectorAll('[data-set-variant]').forEach((button) => {
        button.addEventListener('click', () => {
          apply('variant', button.dataset.setVariant);
          syncUi();
        });
      });
      document.querySelectorAll('[data-set-bg]').forEach((button) => {
        button.addEventListener('click', () => {
          apply('bg', button.dataset.setBg);
          syncUi();
        });
      });
      document.getElementById('theme-toggle').addEventListener('click', () => {
        apply('theme', root.dataset.theme === 'dark' ? 'light' : 'dark');
        syncUi();
      });
    </script>
  </body>
</html>
