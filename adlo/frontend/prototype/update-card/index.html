<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>原型 · 更新卡片（定稿候选）</title>
    <link rel="stylesheet" href="../../src/styles/index.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg-primary, #0f0f0f);
        color: var(--text-primary);
        font-family: var(--font-ui, system-ui, sans-serif);
        display: grid;
        place-items: start center;
        padding: 32px 16px 128px;
      }
      .stage {
        width: 360px;
      }
      .stage__hint {
        margin: 0 0 12px;
        font-size: 11px;
        color: var(--text-muted);
        line-height: 1.6;
      }
      .dropdown {
        width: 360px;
        padding: 8px;
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md, 8px);
        background: var(--bg-secondary);
        box-shadow: 0 12px 32px rgb(0 0 0 / 45%);
      }
      .dropdown__empty {
        padding: 24px 12px;
        text-align: center;
        font-size: 12px;
        color: var(--text-muted);
      }

      /* 卡片本体：与真实组件类名一一对应（adl-update-card*） */
      .adl-update-card {
        padding: 12px;
        border: 1px solid var(--border-default);
        border-radius: var(--radius-md, 8px);
        background: var(--bg-card);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .adl-update-card__head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .adl-update-card__title {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
      }
      .adl-update-card__pill {
        padding: 3px 6px;
        border: 1px solid var(--border-default);
        border-radius: 999px;
        font-size: 10px;
        line-height: 1;
        color: var(--text-secondary);
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }
      .adl-update-card__close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        margin-left: auto;
        padding: 0;
        border: none;
        border-radius: var(--radius-sm, 6px);
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
      }
      .adl-update-card__close:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
      }
      .adl-update-card__notes {
        position: relative;
      }
      .adl-update-card__notes--overflowing {
        padding-bottom: 14px;
      }
      .adl-update-card__notes-text {
        margin: 0;
        padding-right: 18px;
        font-size: 12px;
        line-height: 1.55;
        color: var(--text-secondary);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .adl-update-card__notes-text--expanded {
        display: block;
        max-height: 168px;
        padding-right: 20px;
        overflow-y: auto;
        scrollbar-width: auto;
        scrollbar-color: auto;
      }
      .adl-update-card__notes-text--expanded::-webkit-scrollbar {
        width: 6px;
      }
      .adl-update-card__notes-text--expanded::-webkit-scrollbar-thumb {
        background: var(--border-default);
        border-radius: 999px;
      }
      .adl-update-card__notes-text--expanded::-webkit-scrollbar-thumb:hover {
        background: var(--border-strong);
      }
      .adl-update-card__notes-text--expanded::-webkit-scrollbar-track {
        background: transparent;
      }
      .adl-update-card__toggle {
        position: absolute;
        right: 0;
        bottom: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        padding: 0;
        border: none;
        border-radius: var(--radius-sm, 6px);
        background: var(--bg-card);
        color: var(--text-muted);
        cursor: pointer;
      }
      .adl-update-card__toggle:hover {
        color: var(--text-primary);
        background: var(--bg-hover);
      }
      .adl-update-card__progress {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .adl-update-card__progress-track {
        flex: 1;
        height: 3px;
        border-radius: 2px;
        background: var(--bg-hover);
        overflow: hidden;
      }
      .adl-update-card__progress-fill {
        display: block;
        height: 100%;
        background: var(--text-secondary);
      }
      .adl-update-card__progress-value {
        min-width: 30px;
        text-align: right;
        font-size: 11px;
        color: var(--text-muted);
        font-variant-numeric: tabular-nums;
      }
      .adl-update-card__actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
      }
      .adl-update-card__actions-right {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
      }
      .adl-update-card__btn {
        padding: 6px 12px;
        font: inherit;
        font-size: 12px;
        line-height: 1;
        color: var(--text-primary);
        background: var(--bg-hover);
        border: none;
        border-radius: var(--radius-sm, 6px);
        cursor: pointer;
      }
      .adl-update-card__btn:hover {
        background: color-mix(in srgb, var(--text-primary) 14%, var(--bg-hover));
      }
      .adl-update-card__btn--primary {
        font-weight: 600;
      }

      .bar {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        border: 1px solid var(--border-default);
        border-radius: 10px;
        background: var(--bg-card);
        box-shadow: 0 8px 24px rgb(0 0 0 / 45%);
        font-size: 11px;
        color: var(--text-muted);
      }
      .bar__label {
        padding: 0 4px;
        letter-spacing: 0.06em;
      }
      .bar button {
        font: inherit;
        font-size: 11px;
        padding: 4px 9px;
        border-radius: 6px;
        border: 1px solid var(--border-default);
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
      }
      .bar button[aria-pressed='true'] {
        background: var(--bg-hover);
        border-color: transparent;
        color: var(--text-primary);
        font-weight: 600;
      }
      .bar__sep {
        width: 1px;
        height: 16px;
        background: var(--border-default);
        margin: 0 4px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <p class="stage__hint" id="hint"></p>
      <div class="dropdown" id="mount"></div>
    </div>

    <div class="bar">
      <span class="bar__label">状态</span>
      <button data-state="available">可下载</button>
      <button data-state="downloading">下载中</button>
      <button data-state="downloaded">已下载</button>
      <button data-state="skipped">已跳过</button>
      <span class="bar__sep"></span>
      <span class="bar__label">文案</span>
      <button data-notes="short">短</button>
      <button data-notes="long">长</button>
      <button data-notes="huge">超长</button>
    </div>

    <script type="module">
      const NOTES = {
        short: '修复若干问题',
        long: '本次更新重做了通知卡片排版：标题与版本号分离，说明文字两行截断并保留省略号；下载与安装拆成两步，安装后应用会自动重启；同时修复了安装器覆盖 adl-server.exe 时的文件锁问题',
        huge:
          '本次更新包含以下改动：\n' +
          '一、通知卡片重做排版，标题与版本号分离，说明文字默认两行截断；展开后可以滚动查看完整内容。\n' +
          '二、下载与安装拆成两步，安装后应用会自动重启，重启前请先保存工作。\n' +
          '三、修复安装器覆盖 adl-server.exe 时的文件锁问题，安装不再停在进度条。\n' +
          '四、修复结束 sidecar 时闪出黑色终端窗口的问题。\n' +
          '五、统一代理不可达时的直连回退，弱网下检查更新不再长时间转圈。\n' +
          '六、发布说明改为纯文本首段，避免 Markdown 记号直接出现在卡片里。\n' +
          '七、清单双源（Gitee 优先、GitHub 兜底），任一可用即可完成检查。',
      };

      const params = new URLSearchParams(location.search);
      const state = params.get('state') ?? 'available';
      const notesKind = params.get('notes') ?? 'long';
      let expanded = params.get('expanded') === '1';

      const CHEVRON_DOWN =
        '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>';
      const CHEVRON_UP =
        '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg>';

      function render() {
        const mount = document.getElementById('mount');
        const hint = document.getElementById('hint');
        const labels = { available: '可下载', downloading: '下载中', downloaded: '已下载', skipped: '已跳过' };
        hint.textContent = `状态：${labels[state]} · 文案：${notesKind}${expanded ? ' · 已展开' : ''}`;

        if (state === 'skipped') {
          mount.innerHTML = '<div class="dropdown__empty">暂无通知</div>';
          return;
        }

        const text = NOTES[notesKind];
        mount.innerHTML = `
          <div class="adl-update-card">
            <div class="adl-update-card__head">
              <span class="adl-update-card__title">发现新版本</span>
              <span class="adl-update-card__pill">v0.1.5</span>
              <button class="adl-update-card__close" aria-label="关闭">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
              </button>
            </div>
            <div class="adl-update-card__notes adl-update-card__notes--overflowing">
              <p class="adl-update-card__notes-text${expanded ? ' adl-update-card__notes-text--expanded' : ''}">${text.replace(/\n/g, '<br />')}</p>
              <button class="adl-update-card__toggle" aria-expanded="${expanded}" aria-label="${expanded ? '收起更新说明' : '展开更新说明'}">
                ${expanded ? CHEVRON_UP : CHEVRON_DOWN}
              </button>
            </div>
            ${
              state === 'downloading'
                ? `<div class="adl-update-card__progress">
                     <span class="adl-update-card__progress-track"><span class="adl-update-card__progress-fill" style="width:42%"></span></span>
                     <span class="adl-update-card__progress-value">42%</span>
                   </div>`
                : ''
            }
            <div class="adl-update-card__actions">
              <div class="adl-update-card__actions-right">
                ${
                  state === 'available'
                    ? '<button class="adl-update-card__btn">跳过此版本</button><button class="adl-update-card__btn adl-update-card__btn--primary">下载</button>'
                    : state === 'downloaded'
                      ? '<button class="adl-update-card__btn adl-update-card__btn--primary">安装</button>'
                      : ''
                }
              </div>
            </div>
          </div>`;

        mount.querySelector('.adl-update-card__toggle').addEventListener('click', () => {
          expanded = !expanded;
          const search = new URLSearchParams(location.search);
          if (expanded) search.set('expanded', '1');
          else search.delete('expanded');
          history.replaceState(null, '', `?${search.toString()}`);
          render();
        });
      }

      function update(next) {
        const search = new URLSearchParams(location.search);
        for (const [key, value] of Object.entries(next)) {
          if (value === undefined) search.delete(key);
          else search.set(key, String(value));
        }
        history.replaceState(null, '', `?${search.toString()}`);
        location.reload();
      }

      for (const button of document.querySelectorAll('[data-state]')) {
        button.addEventListener('click', () => update({ state: button.dataset.state }));
      }
      for (const button of document.querySelectorAll('[data-notes]')) {
        button.addEventListener('click', () => update({ notes: button.dataset.notes }));
      }

      for (const button of document.querySelectorAll('[data-state]')) {
        button.setAttribute('aria-pressed', String(button.dataset.state === state));
      }
      for (const button of document.querySelectorAll('[data-notes]')) {
        button.setAttribute('aria-pressed', String(button.dataset.notes === notesKind));
      }

      render();
    </script>
  </body>
</html>
