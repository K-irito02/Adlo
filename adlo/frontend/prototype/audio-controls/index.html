<!doctype html>
<html lang="zh-CN" data-theme="dark" data-dialog="A" data-landing="A">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>原型 · 视频背景音量控件</title>
    <style>
      /* 一次性原型：只回答「弹窗音量行 + 新建标签页右下角音量」长什么样。 */
      :root {
        --font: 'Segoe UI', 'Microsoft YaHei UI', system-ui, sans-serif;
        --radius: 10px;
        --radius-sm: 6px;
        --radius-pill: 999px;
      }
      [data-theme='dark'] {
        --text-primary: #ededed;
        --text-secondary: #b4b4b4;
        --text-muted: #8a8a8a;
        --bg-card: #1b1b1b;
        --bg-elevated: #232323;
        --bg-input: #2a2a2a;
        --bg-hover: rgba(255, 255, 255, 0.08);
        --border-subtle: rgba(255, 255, 255, 0.12);
        --border-default: rgba(255, 255, 255, 0.22);
        --accent: #ededed;
      }
      [data-theme='light'] {
        --text-primary: #1b1b1b;
        --text-secondary: #4d4d4d;
        --text-muted: #737373;
        --bg-card: #fafafa;
        --bg-elevated: #f2f2f2;
        --bg-input: #ffffff;
        --bg-hover: rgba(0, 0, 0, 0.06);
        --border-subtle: rgba(0, 0, 0, 0.12);
        --border-default: rgba(0, 0, 0, 0.24);
        --accent: #111111;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: var(--font);
        color: var(--text-primary);
        background: #0e0f12;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      /* 模拟自定义照片背景 */
      .stage {
        position: relative;
        width: min(1180px, 96vw);
        height: min(720px, 92vh);
        border-radius: 16px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 430px;
        gap: 0;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      }
      .stage::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 20% 20%, rgba(245, 166, 35, 0.85), transparent 45%),
          radial-gradient(circle at 80% 15%, rgba(124, 92, 255, 0.85), transparent 48%),
          radial-gradient(circle at 65% 80%, rgba(20, 184, 166, 0.8), transparent 50%),
          linear-gradient(135deg, #151a22, #222a34 55%, #0d1015);
        filter: saturate(1.1);
      }
      .stage::after {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.18);
      }

      .landing-preview {
        position: relative;
        z-index: 1;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-height: 0;
      }
      .landing-preview__hint {
        position: absolute;
        top: 24px;
        left: 32px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.72);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      .landing-preview__footer {
        align-self: center;
        display: flex;
        gap: 18px;
        color: rgba(255, 255, 255, 0.66);
        font-size: 12px;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }

      .dialog {
        position: relative;
        z-index: 1;
        margin: 24px;
        background: var(--bg-card);
        border: 1px solid var(--border-subtle);
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        overflow-y: auto;
      }
      .dialog h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .label {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
      }
      .mode-group,
      .fill-group {
        display: flex;
        gap: 8px;
      }
      .mode-btn,
      .fill-btn {
        flex: 1;
        padding: 8px;
        border: 1px solid var(--border-default);
        border-radius: var(--radius);
        background: transparent;
        color: var(--text-primary);
        font-size: 12px;
        cursor: pointer;
      }
      .mode-btn.is-active,
      .fill-btn.is-active {
        border-color: var(--text-primary);
        background: var(--bg-elevated);
      }
      .preview {
        position: relative;
        height: 130px;
        border: 1px solid var(--border-default);
        background:
          radial-gradient(circle at 30% 40%, #2f6f8f, transparent 55%),
          linear-gradient(135deg, #0b1a3a, #1d4ed8 45%, #0f766e);
        overflow: hidden;
      }
      .preview__reset {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: rgba(255, 255, 255, 0.75);
        cursor: pointer;
      }
      .preview__reset:hover {
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
      }
      .section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* ── 通用音量原子 ─────────────────────────────────────────── */
      .vol {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .vol__icon {
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--text-secondary);
        cursor: pointer;
        flex-shrink: 0;
      }
      .vol__icon:hover {
        background: var(--bg-hover);
        color: var(--text-primary);
      }
      .vol__range {
        min-width: 0;
        accent-color: var(--accent);
        cursor: pointer;
      }
      .vol__percent {
        min-width: 34px;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        color: var(--text-muted);
        text-align: right;
        border: none;
        background: none;
        cursor: default;
        user-select: none;
      }
      .vol__percent-input {
        width: 40px;
        padding: 1px 3px;
        border: 1px solid var(--text-primary);
        border-radius: 6px;
        background: var(--bg-input);
        color: var(--text-primary);
        font-size: 11px;
        text-align: right;
        outline: none;
      }
      .vol__row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex: 1;
      }

      /* 弹窗：A 紧凑横排 */
      [data-dialog='A'] .vol {
        flex: 1;
      }
      [data-dialog='A'] .vol__range {
        flex: 1;
        height: 18px;
      }
      [data-dialog='A'] .volume-slot {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* 弹窗：B 胶囊容器 */
      [data-dialog='B'] .volume-slot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 10px;
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-pill);
        background: var(--bg-elevated);
      }
      [data-dialog='B'] .vol {
        flex: 1;
      }
      [data-dialog='B'] .vol__range {
        flex: 1;
        height: 4px;
      }

      /* 弹窗：C 数字优先 */
      [data-dialog='C'] .volume-slot {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-direction: row-reverse;
      }
      [data-dialog='C'] .vol__percent {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-primary);
        min-width: 44px;
        text-align: left;
      }
      [data-dialog='C'] .vol__range {
        flex: 1;
        height: 18px;
      }

      /* 弹窗：D 极简线条 */
      [data-dialog='D'] .volume-slot {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      [data-dialog='D'] .vol__range {
        flex: 1;
        height: 2px;
        accent-color: var(--text-muted);
      }
      [data-dialog='D'] .vol__percent {
        color: var(--text-secondary);
      }

      /* ── 新建标签页右下角 ─────────────────────────────────────── */
      [data-landing='A'] .corner {
        position: absolute;
        right: 20px;
        bottom: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      [data-landing='A'] .corner__panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 8px 6px;
        border-radius: 10px;
        background: rgba(20, 20, 20, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.16);
        opacity: 0;
        pointer-events: none;
        transform: translateY(4px);
        transition: 120ms ease;
      }
      [data-landing='A'] .corner:hover .corner__panel {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }
      [data-landing='A'] .vol__range--vertical {
        writing-mode: vertical-lr;
        direction: rtl;
        width: 18px;
        height: 90px;
        accent-color: #fff;
      }
      [data-landing='A'] .corner__trigger {
        width: 30px;
        height: 30px;
        border: none;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.35);
        color: #fff;
        cursor: pointer;
      }

      [data-landing='B'] .corner {
        position: absolute;
        right: 20px;
        bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px;
        border-radius: 999px;
        background: rgba(20, 20, 20, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #fff;
      }
      [data-landing='B'] .corner__panel {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 0;
        overflow: hidden;
        transition: width 140ms ease;
      }
      [data-landing='B'] .corner:hover .corner__panel {
        width: 150px;
      }
      [data-landing='B'] .vol__range {
        width: 100px;
        accent-color: #fff;
      }
      [data-landing='B'] .vol__percent {
        color: rgba(255, 255, 255, 0.8);
        min-width: 0;
      }
      [data-landing='B'] .corner__trigger {
        width: 30px;
        height: 30px;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: #fff;
        cursor: pointer;
      }

      [data-landing='C'] .corner {
        position: absolute;
        right: 20px;
        bottom: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      [data-landing='C'] .corner__knob {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: none;
        cursor: pointer;
        color: #fff;
        background:
          conic-gradient(#fff calc(var(--value) * 1%), rgba(255, 255, 255, 0.22) 0),
          rgba(20, 20, 20, 0.7);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }
      [data-landing='C'] .corner__knob::after {
        content: '';
        position: absolute;
        inset: 5px;
        border-radius: 50%;
        background: rgba(18, 18, 18, 0.85);
      }
      [data-landing='C'] .corner__knob svg {
        position: relative;
        z-index: 1;
      }
      [data-landing='C'] .corner__panel {
        position: absolute;
        bottom: 54px;
        right: 0;
        padding: 4px 8px;
        border-radius: 8px;
        background: rgba(20, 20, 20, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: #fff;
        opacity: 0;
        pointer-events: none;
      }
      [data-landing='C'] .corner:hover .corner__panel {
        opacity: 1;
      }

      [data-landing='D'] .corner {
        position: absolute;
        right: 20px;
        bottom: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 8px 6px;
        border-radius: 8px;
        background: rgba(20, 20, 20, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #fff;
      }
      [data-landing='D'] .corner__panel {
        display: none;
      }
      [data-landing='D'] .corner:hover .corner__panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }
      [data-landing='D'] .vol__range--vertical {
        writing-mode: vertical-lr;
        direction: rtl;
        width: 12px;
        height: 84px;
        accent-color: #fff;
      }
      [data-landing='D'] .corner__trigger,
      [data-landing='C'] .corner__trigger {
        border: none;
        background: transparent;
        color: #fff;
        cursor: pointer;
      }

      /* 原型控制条 */
      .bar {
        position: fixed;
        z-index: 30;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 14px;
        background: rgba(18, 18, 18, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        color: #ededed;
        font-size: 12px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 96vw;
      }
      .bar button {
        border: 1px solid transparent;
        background: rgba(255, 255, 255, 0.06);
        color: #dcdcdc;
        padding: 5px 9px;
        border-radius: 8px;
        font-size: 12px;
        cursor: pointer;
      }
      .bar button.is-active {
        background: #ededed;
        color: #111;
      }
      .bar__sep {
        width: 1px;
        height: 18px;
        background: rgba(255, 255, 255, 0.16);
      }
      .note {
        position: absolute;
        z-index: 2;
        left: 32px;
        top: 56px;
        max-width: 480px;
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 12px;
        line-height: 1.5;
        color: #e8e8e8;
        backdrop-filter: blur(8px);
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="landing-preview">
        <div class="landing-preview__hint">新建标签页（右下角为音量控件）</div>
        <div class="note" id="note"></div>
        <div class="landing-preview__footer">
          <span>端口扫描配置</span>
          <span>自定义背景</span>
        </div>

        <div class="corner" data-corner>
          <div class="corner__panel">
            <input class="vol__range vol__range--vertical" type="range" min="0" max="100" value="60" aria-label="音量" data-volume />
            <button class="vol__percent" type="button" data-percent>60%</button>
          </div>
          <button class="corner__knob corner__trigger" type="button" aria-label="音量">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          </button>
        </div>
      </div>

      <div class="dialog">
        <h2>自定义背景</h2>

        <div class="section">
          <div class="mode-group">
            <button class="mode-btn">默认</button>
            <button class="mode-btn">图片</button>
            <button class="mode-btn is-active">视频</button>
          </div>
        </div>

        <div class="section">
          <div class="preview">
            <button class="preview__reset" type="button" title="复位">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
            </button>
          </div>
        </div>

        <div class="section">
          <span class="label">音量</span>
          <div class="volume-slot">
            <div class="vol">
              <button class="vol__icon" type="button" aria-label="音量">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
              </button>
              <input class="vol__range" type="range" min="0" max="100" value="60" aria-label="音量" data-volume />
              <button class="vol__percent" type="button" data-percent>60%</button>
            </div>
          </div>
        </div>

        <div class="section">
          <span class="label">背景填充</span>
          <div class="fill-group">
            <button class="fill-btn is-active">铺满</button>
            <button class="fill-btn">适应</button>
          </div>
        </div>
      </div>
    </div>

    <div class="bar" role="group" aria-label="原型控制">
      <span>弹窗</span>
      <button data-dialog-choice="A">A 紧凑横排</button>
      <button data-dialog-choice="B">B 胶囊</button>
      <button data-dialog-choice="C">C 数字优先</button>
      <button data-dialog-choice="D">D 极简线条</button>
      <span class="bar__sep"></span>
      <span>右下角</span>
      <button data-landing-choice="A">A 竖向展开</button>
      <button data-landing-choice="B">B 横向气泡</button>
      <button data-landing-choice="C">C 圆形旋钮</button>
      <button data-landing-choice="D">D 常驻竖条</button>
      <span class="bar__sep"></span>
      <button id="theme-toggle">亮/暗</button>
    </div>

    <script>
      const NOTES = {
        dialog: {
          A: 'A 紧凑横排：图标 + 细滑杆 + 百分比同一行，最接近现有实现，改动最小。',
          B: 'B 胶囊：控件装进圆角胶囊容器，弱化边界、更像一体控件。',
          C: 'C 数字优先：百分比放大在左侧（或右侧），滑杆占据剩余宽度，适合“精确调音量”。',
          D: 'D 极简线条：2px 细轨道 + 弱化百分比，最轻，但在深色背景上对精细调节稍差。',
        },
        landing: {
          A: 'A 竖向展开：常态一个图标，悬停向上展开竖向滑杆 + 百分比。',
          B: 'B 横向气泡：常态胶囊图标，悬停向右展开横向滑杆与百分比。',
          C: 'C 圆形旋钮：图标 + 环形进度，悬停显示百分比；更像“播放器”控件。',
          D: 'D 常驻竖条：图标与细竖条常驻右下角，悬停显示百分比；信息最多但占位也最大。',
        },
      };
      const root = document.documentElement;
      const params = new URLSearchParams(location.search);

      root.dataset.dialog = ['A', 'B', 'C', 'D'].includes(params.get('dialog')) ? params.get('dialog') : 'A';
      root.dataset.landing = ['A', 'B', 'C', 'D'].includes(params.get('landing')) ? params.get('landing') : 'A';
      root.dataset.theme = params.get('theme') === 'light' ? 'light' : 'dark';

      function syncUi() {
        document.querySelectorAll('[data-dialog-choice]').forEach((b) => {
          b.classList.toggle('is-active', b.dataset.dialogChoice === root.dataset.dialog);
        });
        document.querySelectorAll('[data-landing-choice]').forEach((b) => {
          b.classList.toggle('is-active', b.dataset.landingChoice === root.dataset.landing);
        });
        document.getElementById('note').textContent =
          NOTES.dialog[root.dataset.dialog] + '　' + NOTES.landing[root.dataset.landing];
        document.querySelectorAll('[data-volume]').forEach((range) => {
          const percent = range.closest('.vol, .corner')?.querySelector('[data-percent]');
          if (percent) percent.textContent = range.value + '%';
          const knob = range.closest('.corner')?.querySelector('.corner__knob');
          if (knob) knob.style.setProperty('--value', range.value);
        });
        const url = new URL(location.href);
        url.searchParams.set('dialog', root.dataset.dialog);
        url.searchParams.set('landing', root.dataset.landing);
        url.searchParams.set('theme', root.dataset.theme);
        history.replaceState(null, '', url);
      }

      document.querySelectorAll('[data-dialog-choice]').forEach((button) => {
        button.addEventListener('click', () => {
          root.dataset.dialog = button.dataset.dialogChoice;
          syncUi();
        });
      });
      document.querySelectorAll('[data-landing-choice]').forEach((button) => {
        button.addEventListener('click', () => {
          root.dataset.landing = button.dataset.landingChoice;
          syncUi();
        });
      });
      document.getElementById('theme-toggle').addEventListener('click', () => {
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
        syncUi();
      });

      document.querySelectorAll('[data-volume]').forEach((range) => {
        range.addEventListener('input', () => {
          const percent = range.closest('.vol, .corner')?.querySelector('[data-percent]');
          if (percent) percent.textContent = range.value + '%';
          const knob = range.closest('.corner')?.querySelector('.corner__knob');
          if (knob) knob.style.setProperty('--value', range.value);
        });
      });

      // 双击百分比 → 输入数值
      document.querySelectorAll('[data-percent]').forEach((button) => {
        button.addEventListener('dblclick', () => {
          const current = button.textContent.replace('%', '');
          const input = document.createElement('input');
          input.className = 'vol__percent-input';
          input.type = 'text';
          input.value = current;
          button.replaceWith(input);
          input.focus();
          input.select();
          const commit = () => {
            const next = document.createElement('button');
            next.className = 'vol__percent';
            next.type = 'button';
            next.dataset.percent = '';
            const value = Math.min(100, Math.max(0, Number(input.value.replace('%', '')) || 0));
            next.textContent = value + '%';
            input.replaceWith(next);
            const range = next.closest('.vol, .corner')?.querySelector('[data-volume]');
            if (range) range.value = String(value);
            bindPercent(next);
          };
          input.addEventListener('blur', commit);
          input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') commit();
            if (event.key === 'Escape') commit();
          });
        });
      });

      function bindPercent(button) {
        button.addEventListener('dblclick', () => {
          const current = button.textContent.replace('%', '');
          const input = document.createElement('input');
          input.className = 'vol__percent-input';
          input.value = current;
          button.replaceWith(input);
          input.focus();
          input.select();
          input.addEventListener('blur', () => {
            const next = document.createElement('button');
            next.className = 'vol__percent';
            next.type = 'button';
            const value = Math.min(100, Math.max(0, Number(input.value.replace('%', '')) || 0));
            next.textContent = value + '%';
            input.replaceWith(next);
            bindPercent(next);
          });
        });
      }

      syncUi();
    </script>
  </body>
</html>
