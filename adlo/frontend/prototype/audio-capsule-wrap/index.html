<!doctype html>
<html lang="zh-CN" data-theme="dark" data-style="thin">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>原型 · 胶囊包裹图标的音量控件</title>
    <style>
      :root {
        --font: 'Segoe UI', 'Microsoft YaHei UI', system-ui, sans-serif;
      }
      [data-theme='dark'] {
        --fg: #f1f1f1;
        --fg-soft: rgba(255, 255, 255, 0.78);
        --veil: rgba(24, 24, 26, 0.62);
        --veil-hover: rgba(255, 255, 255, 0.18);
        --track: rgba(255, 255, 255, 0.22);
        --fill: rgba(255, 255, 255, 0.9);
        --thumb: #ffffff;
      }
      [data-theme='light'] {
        --fg: #161616;
        --fg-soft: rgba(0, 0, 0, 0.7);
        --veil: rgba(255, 255, 255, 0.62);
        --veil-hover: rgba(0, 0, 0, 0.14);
        --track: rgba(0, 0, 0, 0.16);
        --fill: rgba(0, 0, 0, 0.78);
        --thumb: #111111;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: var(--font);
        color: var(--fg);
        background: #0e0f12;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .stage {
        position: relative;
        width: min(1180px, 96vw);
        height: min(700px, 92vh);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      }
      .stage::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 18% 26%, rgba(245, 166, 35, 0.9), transparent 46%),
          radial-gradient(circle at 82% 18%, rgba(124, 92, 255, 0.9), transparent 48%),
          radial-gradient(circle at 62% 84%, rgba(20, 184, 166, 0.78), transparent 52%),
          linear-gradient(135deg, #14181f, #232a33 55%, #0e1116);
      }
      .stage::after {
        content: '';
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.2);
      }
      .note {
        position: absolute;
        z-index: 2;
        left: 28px;
        top: 24px;
        max-width: 600px;
        padding: 8px 12px;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.42);
        backdrop-filter: blur(10px);
        font-size: 12px;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.86);
      }
      .footer {
        position: absolute;
        z-index: 2;
        left: 0;
        right: 0;
        bottom: 28px;
        display: flex;
        justify-content: center;
        gap: 20px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.62);
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }

      /* ── 胶囊：常态圆形，悬停向上包裹图标 ─────────────────────── */
      .corner {
        position: absolute;
        right: 24px;
        bottom: 24px;
        z-index: 3;
      }
      .capsule {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        width: 32px;
        height: 32px;
        border-radius: 999px;
        overflow: hidden;
        background: var(--veil);
        backdrop-filter: blur(16px) saturate(1.15);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.36);
        transition:
          width 160ms ease,
          height 160ms ease;
      }
      .corner:hover .capsule,
      .corner:focus-within .capsule,
      body[data-expanded='1'] .capsule {
        width: 44px;
        height: 176px;
      }
      .extra {
        display: flex;
        flex-direction: column;
        align-items: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms ease;
      }
      .corner:hover .extra,
      .corner:focus-within .extra,
      body[data-expanded='1'] .extra {
        opacity: 1;
        pointer-events: auto;
      }
      .percent {
        margin: 6px 0 2px;
        padding: 1px 6px;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--fg-soft);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
        cursor: default;
        user-select: none;
        transition: background 100ms ease;
      }
      .percent:hover {
        background: var(--veil-hover);
      }
      .trigger {
        width: 32px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 50%;
        background: transparent;
        color: var(--fg-soft);
        cursor: pointer;
        flex-shrink: 0;
        transition: 100ms ease;
      }
      .trigger:hover {
        background: var(--veil-hover);
        color: var(--fg);
      }

      /* ── 滑杆公共结构 ─────────────────────────────────────────── */
      .slider {
        position: relative;
        width: 18px;
        height: 96px;
        margin-bottom: 4px;
        cursor: pointer;
        touch-action: none;
        outline: none;
      }
      .track {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 4px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: var(--track);
      }
      .fill {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        border-radius: 999px;
        background: var(--fill);
      }
      .thumb {
        position: absolute;
        left: 50%;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        transform: translate(-50%, 50%);
        background: var(--thumb);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
      }
      .dots {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column-reverse;
        align-items: center;
        justify-content: space-between;
        padding: 2px 0;
      }
      .dot {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--track);
      }
      .dot.is-on {
        background: var(--fill);
      }
      .slider[data-style='thin'] .track {
        width: 4px;
      }
      .slider[data-style='thin'] .dots {
        display: none;
      }

      .slider[data-style='fill'] .track {
        width: 8px;
      }
      .slider[data-style='fill'] .thumb,
      .slider[data-style='fill'] .dots {
        display: none;
      }

      .slider[data-style='liquid'] .track {
        width: 14px;
      }
      .slider[data-style='liquid'] .fill {
        background: linear-gradient(to top, var(--fill), rgba(255, 255, 255, 0.35));
      }
      .slider[data-style='liquid'] .thumb,
      .slider[data-style='liquid'] .dots {
        display: none;
      }

      .slider[data-style='dots'] .track,
      .slider[data-style='dots'] .fill,
      .slider[data-style='dots'] .thumb {
        display: none;
      }

      .slider[data-style='line'] .track {
        width: 1px;
      }
      .slider[data-style='line'] .thumb {
        width: 14px;
        height: 3px;
        border-radius: 999px;
        background: var(--thumb);
      }
      .slider[data-style='line'] .fill {
        width: 1px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
      }
      .slider[data-style='line'] .dots {
        display: none;
      }

      .bar {
        position: fixed;
        z-index: 30;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 14px;
        background: rgba(18, 18, 18, 0.9);
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        color: #ededed;
        font-size: 12px;
        flex-wrap: wrap;
        justify-content: center;
        max-width: 96vw;
      }
      .bar button {
        border: none;
        background: rgba(255, 255, 255, 0.07);
        color: #dcdcdc;
        padding: 5px 9px;
        border-radius: 8px;
        font-size: 12px;
        cursor: pointer;
      }
      .bar button.is-active {
        background: #ededed;
        color: #111;
      }
      .bar__sep {
        width: 1px;
        height: 18px;
        background: rgba(255, 255, 255, 0.16);
      }
    </style>
  </head>
  <body data-expanded="0">
    <div class="stage">
      <div class="note" id="note"></div>
      <div class="footer"><span>端口扫描配置</span><span>自定义背景</span></div>

      <div class="corner">
        <div class="capsule">
          <div class="extra">
            <button class="percent" type="button" data-percent>60%</button>
            <div class="slider" data-style="thin" role="slider" tabindex="0" aria-label="音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60">
              <div class="track">
                <div class="fill" style="height: 60%"></div>
                <div class="thumb" style="bottom: 60%"></div>
              </div>
              <div class="dots"></div>
            </div>
          </div>
          <button class="trigger" type="button" aria-label="音量">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="bar" role="group" aria-label="原型控制">
      <span>进度条</span>
      <button data-style-choice="thin">S1 细轨圆点</button>
      <button data-style-choice="fill">S2 填充条</button>
      <button data-style-choice="liquid">S3 液面</button>
      <button data-style-choice="dots">S4 刻度点阵</button>
      <button data-style-choice="line">S5 细线横柄</button>
      <span class="bar__sep"></span>
      <button id="expand-toggle">固定展开</button>
      <button id="theme-toggle">亮/暗</button>
    </div>

    <script>
      const NOTES = {
        thin: 'S1 细轨圆点：4px 轨道 + 白色圆点，最通用、最像系统音量条。',
        fill: 'S2 填充条：8px 粗轨道、无圆点，像电量条；干净、手指/鼠标都好抓。',
        liquid: 'S3 液面：14px 宽轨道，填充像液柱从下往上涨；视觉最有趣，适合玻璃胶囊。',
        dots: 'S4 刻度点阵：11 个刻度点按音量点亮，最有“硬件旋钮”感，但精细调节略弱。',
        line: 'S5 细线横柄：1px 细线 + 横向小握柄，最克制，适合不想让控件抢注意力的场景。',
      };
      const root = document.documentElement;
      const body = document.body;
      const params = new URLSearchParams(location.search);
      root.dataset.style = ['thin', 'fill', 'liquid', 'dots', 'line'].includes(params.get('style'))
        ? params.get('style')
        : 'thin';
      root.dataset.theme = params.get('theme') === 'light' ? 'light' : 'dark';
      body.dataset.expanded = params.get('expanded') === '1' ? '1' : '0';

      const slider = document.querySelector('.slider');
      const fill = document.querySelector('.fill');
      const thumb = document.querySelector('.thumb');
      const dotsRoot = document.querySelector('.dots');
      const percent = document.querySelector('[data-percent]');
      let value = 60;

      for (let i = 0; i < 11; i += 1) {
        const dot = document.createElement('span');
        dot.className = 'dot';
        dotsRoot.appendChild(dot);
      }
      const dots = [...dotsRoot.children];

      function render() {
        fill.style.height = value + '%';
        thumb.style.bottom = value + '%';
        percent.textContent = Math.round(value) + '%';
        slider.setAttribute('aria-valuenow', String(Math.round(value)));
        const lit = Math.round((value / 100) * 10);
        dots.forEach((dot, index) => dot.classList.toggle('is-on', index <= lit));
        slider.dataset.style = root.dataset.style;
      }

      function setFromClientY(clientY) {
        const rect = slider.getBoundingClientRect();
        if (rect.height <= 0) return;
        value = Math.min(100, Math.max(0, (1 - (clientY - rect.top) / rect.height) * 100));
        render();
      }

      let dragging = false;
      slider.addEventListener('pointerdown', (event) => {
        dragging = true;
        slider.setPointerCapture?.(event.pointerId);
        setFromClientY(event.clientY);
      });
      slider.addEventListener('pointermove', (event) => {
        if (dragging) setFromClientY(event.clientY);
      });
      slider.addEventListener('pointerup', (event) => {
        dragging = false;
        slider.releasePointerCapture?.(event.pointerId);
      });
      slider.addEventListener('pointercancel', () => {
        dragging = false;
      });
      slider.addEventListener('wheel', (event) => {
        event.preventDefault();
        value = Math.min(100, Math.max(0, value + (event.deltaY < 0 ? 5 : -5)));
        render();
      });
      slider.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowUp') value = Math.min(100, value + 5);
        else if (event.key === 'ArrowDown') value = Math.max(0, value - 5);
        else return;
        event.preventDefault();
        render();
      });

      percent.addEventListener('dblclick', () => {
        const input = document.createElement('input');
        input.type = 'text';
        input.value = String(Math.round(value));
        input.style.width = '40px';
        input.style.padding = '1px 3px';
        input.style.border = '1px solid var(--fg)';
        input.style.borderRadius = '2px';
        input.style.background = 'var(--veil)';
        input.style.color = 'var(--fg)';
        input.style.fontSize = '10px';
        input.style.textAlign = 'right';
        input.style.outline = 'none';
        percent.replaceWith(input);
        input.focus();
        input.select();
        input.addEventListener('blur', () => {
          const next = Math.min(100, Math.max(0, Number(input.value.replace('%', '')) || 0));
          value = next;
          const button = document.createElement('button');
          button.className = 'percent';
          button.type = 'button';
          button.dataset.percent = '';
          button.textContent = Math.round(value) + '%';
          input.replaceWith(button);
          render();
          bindPercent(button);
        });
      });

      function bindPercent(button) {
        button.addEventListener('dblclick', () => {
          const input = document.createElement('input');
          input.type = 'text';
          input.value = String(Math.round(value));
          input.style.width = '40px';
          input.style.padding = '1px 3px';
          input.style.border = '1px solid var(--fg)';
          input.style.borderRadius = '2px';
          input.style.background = 'var(--veil)';
          input.style.color = 'var(--fg)';
          input.style.fontSize = '10px';
          input.style.textAlign = 'right';
          input.style.outline = 'none';
          button.replaceWith(input);
          input.focus();
          input.select();
          input.addEventListener('blur', () => {
            value = Math.min(100, Math.max(0, Number(input.value.replace('%', '')) || 0));
            const next = document.createElement('button');
            next.className = 'percent';
            next.type = 'button';
            next.textContent = Math.round(value) + '%';
            input.replaceWith(next);
            render();
            bindPercent(next);
          });
        });
      }

      function sync() {
        document.querySelectorAll('[data-style-choice]').forEach((button) => {
          button.classList.toggle('is-active', button.dataset.styleChoice === root.dataset.style);
        });
        document.getElementById('expand-toggle').classList.toggle(
          'is-active',
          body.dataset.expanded === '1',
        );
        document.getElementById('note').textContent =
          NOTES[root.dataset.style] + ' 胶囊常态 32×32，悬停向上生长并把音量图标包在底部。';
        slider.dataset.style = root.dataset.style;
        const url = new URL(location.href);
        url.searchParams.set('style', root.dataset.style);
        url.searchParams.set('theme', root.dataset.theme);
        url.searchParams.set('expanded', body.dataset.expanded);
        history.replaceState(null, '', url);
      }

      document.querySelectorAll('[data-style-choice]').forEach((button) => {
        button.addEventListener('click', () => {
          root.dataset.style = button.dataset.styleChoice;
          render();
          sync();
        });
      });
      document.getElementById('expand-toggle').addEventListener('click', () => {
        body.dataset.expanded = body.dataset.expanded === '1' ? '0' : '1';
        sync();
      });

      render();
      sync();
    </script>
  </body>
</html>
