[package]
name = "adlo"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
adl-kernel = { path = "../crates/kernel" }
adl-types = { path = "../crates/types" }
adl-errors = { path = "../crates/errors" }
adl-workspace = { path = "../crates/workspace" }
adl-browser = { path = "../crates/browser" }
adl-logging = { path = "../crates/adl-logging" }
adl-storage = { path = "../crates/storage" }
adl-migration = { path = "../crates/migration" }
adl-update = { path = "../crates/update" }
adl-download-source = { path = "../crates/download-source" }

tauri = { workspace = true, features = ["unstable", "protocol-asset"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-shell.workspace = true
tauri-plugin-updater.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
futures.workspace = true
reqwest.workspace = true
url.workspace = true
base64 = "0.22"
uuid.workspace = true

# Desktop E2E only: embedded WebDriver server + WDIO bridge plugin
# (opt-in via `--features e2e`). Never enable this feature in shipped builds.
tauri-plugin-wdio-webdriver = { version = "1.5.1", optional = true }
tauri-plugin-wdio = { version = "1.5.1", optional = true }

[target.'cfg(windows)'.dependencies]
# `#[implement(IDropTarget)]` 展开的代码直接引用 `windows_core::`，必须显式声明。
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_SystemInformation",
  # 事项 17：应用身份（AUMID）——进程身份 + 窗口身份 + 注册表 DisplayName/IconUri
  "Win32_System_Registry",
  # RegCreateKeyExW 的 SECURITY_ATTRIBUTES 参数来自 Win32::Security（隐式依赖，勿删）
  "Win32_Security",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  # adl-server sidecar: Windows job object with KILL_ON_JOB_CLOSE (orphan safety net)
  "Win32_System_JobObjects",
  "Win32_Storage_EnhancedStorage",
  # 诊断 example（src-tauri/examples/smtc-probe.rs）：读取系统媒体会话归属
  "Media_Control",
  # 诊断 example 枚举窗口（GetWindowText / EnumWindows）
  "Win32_UI_WindowsAndMessaging",
  # 事项 17 路线 A：宿主侧自建系统媒体会话（SMTC）
  "Media",
  "Win32_System_WinRT",
  "Foundation",
  "Foundation_Collections",
] }

[features]
# `devtools` 进 default：发布构建也要能“为浏览器标签页打开 DevTools”（菜单「打开开发者工具」）。
# 该 feature 让补丁运行时把**每个** WebView 的 `devtools` 属性回落为 true
# （`webview_attributes.devtools.unwrap_or(true)`），所以必须逐处显式关闭不需要
# 调试面的 WebView：
#   - 应用壳窗口：`tauri.conf.json` 的 `"devtools": false`（debug / release 都生效；
#     开发期若需要检查壳 UI，临时把该字段改成 true）
#   - 静默 WebView、分隔条：builder 上 `.devtools(false)`
# 可见标签 WebView 上的 `.devtools(true)` 只是把这个默认值显式写出来，不是开关本身。
default = ["custom-protocol", "devtools"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]
# Enables the embedded WebDriver server used by `e2e/` (WDIO Tauri service).
# The plugin only starts when the test runner sets TAURI_WEBDRIVER_PORT.
e2e = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio"]
