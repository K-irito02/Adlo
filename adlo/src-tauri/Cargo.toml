[package]
name = "adlo"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[build-dependencies]
tauri-build.workspace = true

[dependencies]
adl-kernel = { path = "../crates/kernel" }
adl-types = { path = "../crates/types" }
adl-errors = { path = "../crates/errors" }
adl-workspace = { path = "../crates/workspace" }
adl-browser = { path = "../crates/browser" }
adl-logging = { path = "../crates/adl-logging" }
adl-storage = { path = "../crates/storage" }
adl-migration = { path = "../crates/migration" }
adl-update = { path = "../crates/update" }
adl-download-source = { path = "../crates/download-source" }

tauri = { workspace = true, features = ["unstable"] }
tauri-plugin-dialog.workspace = true
tauri-plugin-shell.workspace = true
tauri-plugin-updater.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
anyhow.workspace = true
futures.workspace = true
reqwest.workspace = true
url.workspace = true
base64 = "0.22"

# Desktop E2E only: embedded WebDriver server + WDIO bridge plugin
# (opt-in via `--features e2e`). Never enable this feature in shipped builds.
tauri-plugin-wdio-webdriver = { version = "1.5.1", optional = true }
tauri-plugin-wdio = { version = "1.5.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Enables the embedded WebDriver server used by `e2e/` (WDIO Tauri service).
# The plugin only starts when the test runner sets TAURI_WEBDRIVER_PORT.
e2e = ["dep:tauri-plugin-wdio-webdriver", "dep:tauri-plugin-wdio"]
