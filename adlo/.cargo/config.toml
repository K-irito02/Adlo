# Cargo 工作区配置
#
# 磁盘治理（见 adlo/AGENTS.md#磁盘空间管理）：
# - 清理脚本（空间阈值触发全量清理：target/debug 超 30GB 即 cargo clean）：
#     powershell -File .cargo/clean-target.ps1
# - 全清所有构建产物（下次需完整重建）：
#     cargo clean（永久删除：直接物理删除，不进入回收站/垃圾箱，无需清空回收站）

[alias]
# 清理所有构建产物，然后完整重建
rebuild = "clean && build"
# 全清入口（cargo alias 无法运行 PS 脚本，条件清理请用 clean-target.ps1）
prune = "clean"

[profile.dev]
# 增量编译会话由 clean-target.ps1 在 target/debug 超阈值时全量清理，重新启用增量编译以加速开发迭代
#（2026-07-18 曾因 rustc 1.96 ICE 关闭，1.97.1 已修复）

# 第三方依赖：仅保留行号级调试信息，PDB 体积缩至 ~1/10
#（请勿删除 —— target/debug 曾达 130+ GB，97 GB 为依赖全量 debug 类型的 .pdb）
[profile.dev.package."*"]
debug = 1
opt-level = 1

# 白名单：自己的 crate 保留全量调试信息（debug=2，可断点调试查变量类型）
