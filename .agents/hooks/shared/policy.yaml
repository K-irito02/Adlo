version: 1
modes:
  warn:
    meaning: 提示风险，不阻断
  block:
    meaning: 阻断当前动作，要求补充材料或调整方案
  approval:
    meaning: 当前动作必须审批或显式确认后才能继续
severity_defaults:
  low: warn
  medium: block
  high: approval
fallback_policy:
  default: warn
  high_risk_approval_failure: block
principles:
  - hook 用于治理开发流程，而不是代替实现逻辑
  - hook 执行失败时默认降级为显式告警
  - 高风险审批型 hook 失败时优先阻断
