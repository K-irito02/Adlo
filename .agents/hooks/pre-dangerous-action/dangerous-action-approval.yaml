id: dangerous-action-approval
event: pre-dangerous-action
severity: high
mode: approval
condition:
  any:
    - deletes_files: true
    - overwrites_many_files: true
    - resets_or_rewrites_state: true
    - executes_dangerous_git_operation: true
    - executes_dangerous_command: true
action:
  type: approval-gate
  required_agents: [task-governance, app-security]
  message: |
    当前动作属于高风险破坏性操作，必须先进入审批链，并说明影响范围、恢复路径和审计要求。
timeout: 3000
fallback: block
