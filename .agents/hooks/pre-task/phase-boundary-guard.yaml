id: phase-boundary-guard
event: pre-task
severity: medium
mode: block
condition:
  any:
    - task_phase_missing: true
    - phase_scope_conflict: true
    - introduces_phase2_plus_capability_into_phase0: true
action:
  type: governance-check
  message: |
    任务缺少明确阶段归属，或试图在当前阶段引入超范围能力。
    先补充 phase、in-scope/out-of-scope、验收标准，再继续。
timeout: 3000
fallback: warn
