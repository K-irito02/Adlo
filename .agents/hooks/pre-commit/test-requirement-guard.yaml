id: test-requirement-guard
event: pre-commit
severity: medium
mode: block
condition:
  any:
    - high_risk_change_without_test_plan: true
    - high_risk_change_without_validation_note: true
    - cross_module_change_without_regression_statement: true
action:
  type: quality-gate
  required_agents: [test-engineer]
  message: |
    当前改动风险较高，但缺少测试计划或验证说明。补齐验证路径、验收标准和残余风险后再继续。
timeout: 3000
fallback: warn
