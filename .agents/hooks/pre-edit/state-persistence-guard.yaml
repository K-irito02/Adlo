id: state-persistence-guard
event: pre-edit
severity: high
mode: block
condition:
  any:
    - changes_persisted_state_schema_without_migration_plan: true
    - mixes_ui_state_with_persistence_source_of_truth: true
    - changes_config_layering_without_boundary_note: true
    - changes_recovery_or_restore_flow_without_failure_path: true
action:
  type: persistence-review-required
  required_agents: [architect, infra-foundation]
  message: |
    当前修改触及配置、持久化、迁移或恢复基线。必须补充 schema 版本、
    迁移/回滚策略、状态真相源边界和失败恢复路径说明后再继续。
timeout: 3000
fallback: warn
