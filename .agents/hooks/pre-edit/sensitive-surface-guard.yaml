id: sensitive-surface-guard
event: pre-edit
severity: high
mode: block
condition:
  any:
    - touches_electron_security_surface: true
    - touches_secret_storage: true
    - exposes_renderer_system_access: true
    - adds_unrestricted_write_or_execute_path: true
action:
  type: security-review-required
  required_agents: [desktop-shell, app-security]
  message: |
    当前修改触及敏感安全面。必须经过 desktop-shell 与 app-security 共同审视，
    并显式说明权限边界、凭据处理和回归风险。
timeout: 3000
fallback: warn
