id: architecture-consistency-guard
event: pre-edit
severity: medium
mode: block
condition:
  any:
    - introduces_low_to_high_dependency: true
    - mixes_ui_and_business_logic: true
    - creates_multiple_event_buses: true
    - bypasses_main_ipc_boundary: true
action:
  type: architecture-review-required
  required_agents: [architect]
  message: |
    当前修改可能破坏分层或依赖方向。先补充边界说明，并确认由 architect 审核后再继续。
timeout: 3000
fallback: warn
