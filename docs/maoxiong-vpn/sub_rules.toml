# ============================================
# 代理组 (proxy_groups)
# ============================================

[[proxy_groups]]
name = "🚀 手动切换"
type = "select"
regex = ".*"
proxies = ["🇭🇰 香港(自动/手动)", "🇺🇸 美国(自动/手动)", "🇯🇵 日本(自动/手动)", "🇸🇬 新加坡(自动/手动)", "🇹🇼 台湾(自动/手动)", "专线", "♻️ 自动选择", "DIRECT"]

[[proxy_groups]]
name = "♻️ 自动选择"
type = "url-test"
# 「直连(?!-V)」用 negative lookahead 精确区分：「直连」后面不跟「-V」才算伪节点
#   - "🎯 全球直连" / "网站直连" / "客服直连" → 排除 ✓
#   - "直连-V310-台湾" / "直连-VIP3-广港" → 保留 ✓ (我方 IPLC 跨境专线节点命名约定)
regex = "^(?!.*(?:emby|Emby|剩余|到期|流量|官网|订阅|过期|更新|网站|直连(?!-V)|Traffic|Expire|expired|套餐|GB|MB|机场)).*$"
url = "http://www.gstatic.com/generate_204"
interval = 300
tolerance = 50

# ── 地区分组（方案 A）─────────────────────────────────
# 每个地区组本身就是 url-test：自动测速选该地区延迟最低的节点。
# 想手动指定节点：在客户端（Sparkle / Clash Party / mihomo Party 等 mihomo 系）
#   直接点该组里的具体节点即可「固定」，覆盖自动测速。
# regex 统一排除机场伪节点（流量/到期/官网等）+ 保留 IPLC 专线（直连-V 命名），
#   只把真实节点纳入测速。url/interval/tolerance 与「♻️ 自动选择」一致。
# ──────────────────────────────────────────────────────

[[proxy_groups]]
name = "🇭🇰 香港(自动/手动)"
type = "url-test"
regex = "^(?!.*(?:emby|Emby|剩余|到期|流量|官网|订阅|过期|更新|网站|直连(?!-V)|Traffic|Expire|expired|套餐|GB|MB|机场)).*🇭🇰.*$"
url = "http://www.gstatic.com/generate_204"
interval = 300
tolerance = 50

[[proxy_groups]]
name = "🇺🇸 美国(自动/手动)"
type = "url-test"
regex = "^(?!.*(?:emby|Emby|剩余|到期|流量|官网|订阅|过期|更新|网站|直连(?!-V)|Traffic|Expire|expired|套餐|GB|MB|机场)).*🇺🇸.*$"
url = "http://www.gstatic.com/generate_204"
interval = 300
tolerance = 50

[[proxy_groups]]
name = "🇯🇵 日本(自动/手动)"
type = "url-test"
regex = "^(?!.*(?:emby|Emby|剩余|到期|流量|官网|订阅|过期|更新|网站|直连(?!-V)|Traffic|Expire|expired|套餐|GB|MB|机场)).*🇯🇵.*$"
